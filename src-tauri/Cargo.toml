[package]
name = "grove-lite"
version = "0.1.0"
description = "Grove Lite, a very minimal browser"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grove-core = { path = "../crates/grove-core" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
