<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grove Lite</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <header id="strip" data-tauri-drag-region>
    <nav id="tabs" role="tablist"></nav>
    <button id="plus" tabindex="-1" aria-label="new tab">+</button>
    <div id="fill" data-tauri-drag-region></div>
    <div id="controls">
      <button class="min" data-act="minimize" tabindex="-1" aria-label="minimize"></button>
      <button class="max" data-act="maximize" tabindex="-1" aria-label="maximize"></button>
      <button class="close" data-act="close" tabindex="-1" aria-label="close"></button>
    </div>
  </header>
  <form id="bar" autocomplete="off">
    <input id="url" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="search or enter address" aria-label="search or enter address">
    <div id="progress"></div>
  </form>
  <script src="keys.js"></script>
  <script src="chrome.js"></script>
</body>
</html>
